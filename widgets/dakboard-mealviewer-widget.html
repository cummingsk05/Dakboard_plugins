<!--
  DakBoard Widget Block: MealViewer School Lunch Menu
  =====================================================
  HOW TO USE:
  1. On your DakBoard Custom Screen, click "Add a Block" -> "Widget Block".
  2. Paste this entire file's contents into the widget's code/settings box.
  3. Edit the CONFIG section below:
       - SCHOOL_SLUG: MealViewer's URL-safe name for your school
       - PROXY_URL:   leave blank to try MealViewer directly first.
                      If the menu never loads (check browser console for a
                      CORS error), deploy the companion Cloudflare Worker
                      (mealviewer-proxy-worker.js) and paste its URL here.
  4. Resize the block on your DakBoard layout as needed.

  FINDING YOUR SCHOOL_SLUG:
  Go to https://www.mealviewer.com, search for your school, open its menu
  page, and look at the network requests (or the page URL) for a segment
  that matches your school's name with no spaces, e.g. "ElmwoodElementary".
-->

<div id="mv-widget" style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; width: 100%; height: 100%; box-sizing: border-box; padding: 12px;">
  <div id="mv-title" style="font-size: 1.4em; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85;">
    Today's Lunch Menu
  </div>
  <div id="mv-content" style="font-size: 1.1em; line-height: 1.5;">
    Loading menu…
  </div>
</div>

<script>
(function () {
  // ---------------- CONFIG ----------------
  var SCHOOL_SLUG = "BlessedSacrament";      // <-- your school's MealViewer slug
  var PROXY_URL = "";                       // <-- e.g. "https://mealviewer-proxy.yourname.workers.dev"
  // -----------------------------------------

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function todayMMDDYYYY() {
    var d = new Date();
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + d.getFullYear();
  }

  function buildUrl() {
    var date = todayMMDDYYYY();
    var path = "/api/v4/school/" + encodeURIComponent(SCHOOL_SLUG) + "/" + date + "/" + date + "/";
    if (PROXY_URL) {
      // Proxy forwards ?path= to the real MealViewer endpoint
      return PROXY_URL.replace(/\/$/, "") + "/?path=" + encodeURIComponent(path);
    }
    return "https://api.mealviewer.com" + path;
  }

  // Set to true temporarily to see the raw JSON response on screen.
  var DEBUG_MODE = false;

  // Item types to hide (e.g. milk cartons, condiments). Matched against
  // each item's "item_Type" field, case-insensitive. Leave empty to show all.
  var SKIP_ITEM_TYPES = ["MILK", "CONDIMENTS", "MISCELLANEOUS"];

  function renderError(msg) {
    document.getElementById("mv-content").innerHTML =
      '<div style="opacity:0.7;">' + msg + '</div>';
  }

  function renderMenu(data) {
    if (DEBUG_MODE) {
      document.getElementById("mv-content").innerHTML =
        '<pre style="white-space: pre-wrap; font-size: 0.55em; line-height:1.3; opacity:0.9;">' +
        JSON.stringify(data, null, 2)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
        '</pre>';
      console.log("MealViewer raw response:", data);
      return;
    }

    var schedules = (data && data.menuSchedules) || [];
    if (!schedules.length) {
      renderError("No menu scheduled for today.");
      return;
    }

    var html = "";
    var foundAnyItem = false;

    for (var s = 0; s < schedules.length; s++) {
      var blocks = schedules[s].menuBlocks || [];
      for (var b = 0; b < blocks.length; b++) {
        var block = blocks[b];
        var lines = (block.cafeteriaLineList && block.cafeteriaLineList.data) || [];

        var blockItemsHtml = "";
        for (var l = 0; l < lines.length; l++) {
          var line = lines[l];
          var items = (line.foodItemList && line.foodItemList.data) || [];

          for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var itemType = (item.item_Type || "").toUpperCase();
            if (SKIP_ITEM_TYPES.indexOf(itemType) !== -1) continue;
            if (!item.item_Name) continue;

            blockItemsHtml += "<li>" + item.item_Name.trim() + "</li>";
            foundAnyItem = true;
          }
        }

        if (blockItemsHtml) {
          html += '<div style="margin-bottom: 12px;">';
          if (block.blockName) {
            html += '<div style="font-weight:600; opacity:0.8; margin-bottom:4px;">' + block.blockName + '</div>';
          }
          html += '<ul style="margin:0; padding-left: 1.2em;">' + blockItemsHtml + '</ul></div>';
        }
      }
    }

    document.getElementById("mv-content").innerHTML = foundAnyItem
      ? html
      : "No items listed today.";
  }

  function loadMenu() {
    fetch(buildUrl())
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(renderMenu)
      .catch(function (err) {
        console.error("MealViewer widget error:", err);
        renderError("Menu unavailable (see console — likely a CORS block; set up the proxy).");
      });
  }

  loadMenu();
  // Refresh once an hour in case DakBoard keeps the page open across midnight
  setInterval(loadMenu, 60 * 60 * 1000);
})();
</script>
