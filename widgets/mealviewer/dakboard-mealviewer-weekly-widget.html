<!--
  DakBoard Widget Block: MealViewer WEEKLY Menu
  =====================================================
-->

<div id="mv-week-widget" style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; width: 100%; height: 100%; box-sizing: border-box; padding: 12px; overflow: auto;">
  <div id="mv-week-title" style="font-size: 1.4em; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85;">
    Weekly Menu
  </div>
  <div id="mv-week-content" style="font-size: 1em; line-height: 1.4;">
    Loading menu...
  </div>
</div>

<script>
(function () {
  var SCHOOL_SLUG = "SchoolName";
  var CHILD_NAME = "";
  var PROXY_URL = "";
  var ALLERGENS = [];
  var SKIP_ITEM_TYPES = ["MILK", "CONDIMENTS", "MISCELLANEOUS"];
  var DAY_NAMES_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function formatMMDDYYYY(d) {
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + d.getFullYear();
  }

  function getWeekRange() {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var dow = today.getDay();
    var monday = new Date(today);
    if (dow === 0) {
      monday.setDate(today.getDate() + 1);
    } else if (dow === 6) {
      monday.setDate(today.getDate() + 2);
    } else {
      monday.setDate(today.getDate() - (dow - 1));
    }
    var friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    return { monday: monday, friday: friday };
  }

  function buildUrl(monday, friday) {
    var path = "/api/v4/school/" + encodeURIComponent(SCHOOL_SLUG) + "/" + formatMMDDYYYY(monday) + "/" + formatMMDDYYYY(friday) + "/";
    if (PROXY_URL) return PROXY_URL.replace(/\/$/, "") + "/?path=" + encodeURIComponent(path);
    return "https://api.mealviewer.com" + path;
  }

  function renderError(msg) {
    document.getElementById("mv-week-content").innerHTML = '<div style="opacity:0.7;">' + msg + '</div>';
  }

  function updateTitle(monday, friday) {
    var rangeLabel = DAY_NAMES_SHORT[monday.getDay()] + " " + (monday.getMonth() + 1) + "/" + monday.getDate() + " - " + DAY_NAMES_SHORT[friday.getDay()] + " " + (friday.getMonth() + 1) + "/" + friday.getDate();
    var label = CHILD_NAME ? CHILD_NAME + "'s Weekly Menu" : "Weekly Menu";
    label += " - " + rangeLabel;
    document.getElementById("mv-week-title").textContent = label;
  }

  function normalizeValue(v) {
    return String(v || "")
      .toLowerCase()
      .replace(/[_-]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function extractAllergenStrings(item) {
    var out = [];
    var raw = item && (item.allergens || item.allergen || item.allergenList || item.allergenWarnings);
    if (!raw) return out;
    if (typeof raw === "string") {
      out.push(raw);
      return out;
    }
    if (Array.isArray(raw)) {
      for (var i = 0; i < raw.length; i++) {
        var v = raw[i];
        if (!v) continue;
        if (typeof v === "string") {
          out.push(v);
        } else if (typeof v === "object") {
          out.push(v.name || v.label || v.allergen || v.value || JSON.stringify(v));
        }
      }
      return out;
    }
    if (typeof raw === "object") {
      for (var k in raw) {
        if (Object.prototype.hasOwnProperty.call(raw, k) && raw[k]) out.push(k);
      }
    }
    return out;
  }

  function hasAllergen(item) {
    if (!ALLERGENS || ALLERGENS.length === 0) return false;
    var itemAllergenValues = extractAllergenStrings(item).map(normalizeValue);
    for (var a = 0; a < ALLERGENS.length; a++) {
      var target = normalizeValue(ALLERGENS[a]);
      if (!target) continue;
      for (var i = 0; i < itemAllergenValues.length; i++) {
        if (itemAllergenValues[i] === target) return true;
        if (itemAllergenValues[i].indexOf(target) !== -1) return true;
        if (target.indexOf(itemAllergenValues[i]) !== -1) return true;
      }
    }
    return false;
  }

  function renderBlockContent(block) {
    var lines = (block.cafeteriaLineList && block.cafeteriaLineList.data) || [];
    var html = "";
    for (var l = 0; l < lines.length; l++) {
      var items = (lines[l].foodItemList && lines[l].foodItemList.data) || [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var itemType = (item.item_Type || "").toUpperCase();
        if (SKIP_ITEM_TYPES.indexOf(itemType) !== -1) continue;
        if (!item.item_Name) continue;

        var allergenMatch = hasAllergen(item);
        var liStyle = "";
        var badge = "";

        if (allergenMatch) {
          liStyle = ' style="background-color: rgba(255, 0, 0, 0.2); padding: 2px 4px; border-radius: 3px; margin: 1px 0;"';
          badge = '<span style="color: #ff6b6b; font-weight: bold; margin-right: 3px;">⚠️</span>';
        }
        html += "<li" + liStyle + ">" + badge + item.item_Name.trim() + "</li>";
      }
    }
    return html;
  }

  function renderDaySchedule(schedule) {
    var blocks = (schedule && schedule.menuBlocks) || [];
    var breakfastHtml = "";
    var lunchHtml = "";
    for (var b = 0; b < blocks.length; b++) {
      var block = blocks[b];
      var blockName = (block.blockName || "").toLowerCase();
      var content = renderBlockContent(block);
      if (!content) continue;
      if (blockName.indexOf("breakfast") !== -1) breakfastHtml += content;
      else lunchHtml += content;
    }
    return { breakfastHtml: breakfastHtml, lunchHtml: lunchHtml };
  }

  function renderWeek(data, monday) {
    var schedules = (data && data.menuSchedules) || [];
    if (!schedules.length) {
      renderError("No menu found for this week.");
      return;
    }

    var weekdays = [];
    for (var i = 0; i < 5; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      weekdays.push(d);
    }

    var html = '<div style="display: flex; gap: 12px;">';
    for (var w = 0; w < weekdays.length; w++) {
      var date = weekdays[w];
      var schedule = schedules[w];
      var dayResult = schedule ? renderDaySchedule(schedule) : { breakfastHtml: "", lunchHtml: "" };
      var hasBreakfast = !!dayResult.breakfastHtml;
      var hasLunch = !!dayResult.lunchHtml;
      var isToday = date.toDateString() === new Date().toDateString();

      html += '<div style="flex: 1; min-width: 140px; background: rgba(255,255,255,' +
        (isToday ? '0.12' : '0.05') + '); border-radius: 8px; padding: 10px;' +
        (isToday ? ' border: 1px solid rgba(255,255,255,0.35);' : '') + '">';
      html += '<div style="font-weight:700; margin-bottom: 8px; text-align:center;">' +
        DAY_NAMES_SHORT[date.getDay()] + ' <span style="opacity:0.6; font-weight:400;">' +
        (date.getMonth() + 1) + '/' + date.getDate() + '</span></div>';

      if (!hasBreakfast && !hasLunch) {
        html += '<div style="opacity:0.5; font-size:0.85em; text-align:center;">No menu</div>';
      } else {
        if (hasBreakfast) {
          html += '<div style="font-size:0.8em; font-weight:600; opacity:0.7; text-transform:uppercase; margin-bottom:2px;">Breakfast</div>';
          html += '<ul style="margin:0 0 8px 0; padding-left: 1.1em; font-size:0.85em;">' + dayResult.breakfastHtml + '</ul>';
        }
        if (hasLunch) {
          html += '<div style="font-size:0.8em; font-weight:600; opacity:0.7; text-transform:uppercase; margin-bottom:2px;">Lunch</div>';
          html += '<ul style="margin:0; padding-left: 1.1em; font-size:0.85em;">' + dayResult.lunchHtml + '</ul>';
        }
      }

      html += '</div>';
    }

    html += '</div>';
    document.getElementById("mv-week-content").innerHTML = html;
  }

  function loadWeek() {
    var range = getWeekRange();
    updateTitle(range.monday, range.friday);
    fetch(buildUrl(range.monday, range.friday))
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) { renderWeek(data, range.monday); })
      .catch(function (err) {
        console.error("MealViewer weekly widget error:", err);
        renderError("Menu unavailable (see console — likely a CORS block; set up the proxy).");
      });
  }

  loadWeek();
  setInterval(loadWeek, 60 * 60 * 1000);
})();
</script>
