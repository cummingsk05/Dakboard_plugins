<!--
  DakBoard Widget Block: MealViewer School Lunch Menu
  =====================================================
  HOW TO USE:
  1. On your DakBoard Custom Screen, click "Add a Block" -> "Widget Block".
  2. Paste this entire file's contents into the widget's code/settings box.
  3. Edit the CONFIG section below:
       - SCHOOL_SLUG: MealViewer's URL-safe name for your school
       - PROXY_URL: leave blank to try MealViewer directly first
       - ALLERGENS: list allergens to highlight
       - CHILD_NAME: optional name to personalize the widget
  4. Resize the block on your DakBoard layout as needed.
-->

<div id="mv-widget" style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; width: 100%; height: 100%; box-sizing: border-box; padding: 12px;">
  <div id="mv-title" style="font-size: 1.4em; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85;">
    Today's Lunch Menu
  </div>
  <div id="mv-content" style="font-size: 1.1em; line-height: 1.5;">
    Loading menu...
  </div>
</div>

<script>
(function () {
  // ---------------- CONFIG ----------------
  var SCHOOL_SLUG = "SchoolName";
  var CHILD_NAME = "";
  var PROXY_URL = "";
  var ALLERGENS = []; // e.g. ["Peanuts", "Tree Nuts", "Shellfish"]

  // Supported allergen labels from MealViewer-style responses:
  // Milk, Eggs, Peanuts, Tree Nuts, Fish, Shellfish, Soy, Wheat,
  // Sesame, Sulfites, Mustard, Celery, Lupin, Mollusks
  // ----------------------------------------

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function targetDate() {
    var d = new Date();
    if (d.getHours() >= 14) {
      d.setDate(d.getDate() + 1);
    }
    while (d.getDay() === 0 || d.getDay() === 6) {
      d.setDate(d.getDate() + 1);
    }
    return d;
  }

  function formatMMDDYYYY(d) {
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + d.getFullYear();
  }

  function buildUrl() {
    var date = formatMMDDYYYY(targetDate());
    var path = "/api/v4/school/" + encodeURIComponent(SCHOOL_SLUG) + "/" + date + "/" + date + "/";
    if (PROXY_URL) {
      return PROXY_URL.replace(/\/$/, "") + "/?path=" + encodeURIComponent(path);
    }
    return "https://api.mealviewer.com" + path;
  }

  var DEBUG_MODE = false;
  var SKIP_ITEM_TYPES = ["MILK", "CONDIMENTS", "MISCELLANEOUS"];

  function normalizeValue(v) {
    return String(v || "")
      .toLowerCase()
      .replace(/[_-]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function extractAllergenStrings(item) {
    var out = [];
    var raw = item && (item.allergens || item.allergen || item.allergenList || item.allergenWarnings);

    if (!raw) return out;

    if (typeof raw === "string") {
      out.push(raw);
      return out;
    }

    if (Array.isArray(raw)) {
      for (var i = 0; i < raw.length; i++) {
        var v = raw[i];
        if (!v) continue;
        if (typeof v === "string") {
          out.push(v);
        } else if (typeof v === "object") {
          out.push(v.name || v.label || v.allergen || v.value || JSON.stringify(v));
        }
      }
      return out;
    }

    if (typeof raw === "object") {
      for (var k in raw) {
        if (!Object.prototype.hasOwnProperty.call(raw, k)) continue;
        if (raw[k]) out.push(k);
      }
    }

    return out;
  }

  function hasAllergen(item) {
    if (!ALLERGENS || ALLERGENS.length === 0) return false;

    var itemAllergenValues = extractAllergenStrings(item).map(normalizeValue);

    for (var a = 0; a < ALLERGENS.length; a++) {
      var target = normalizeValue(ALLERGENS[a]);
      if (!target) continue;

      for (var i = 0; i < itemAllergenValues.length; i++) {
        if (itemAllergenValues[i] === target) return true;
        if (itemAllergenValues[i].indexOf(target) !== -1) return true;
        if (target.indexOf(itemAllergenValues[i]) !== -1) return true;
      }
    }

    return false;
  }

  function updateTitle() {
    var today = new Date();
    var target = targetDate();
    var isSameDay = target.toDateString() === today.toDateString();
    var tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    var isNextCalendarDay = target.toDateString() === tomorrow.toDateString();
    var timeLabel = isSameDay ? "today" : (isNextCalendarDay ? "tomorrow" : "next school day");
    var label = CHILD_NAME ? CHILD_NAME + "'s Menu (" + timeLabel + ")" : "Menu (" + timeLabel + ")";
    document.getElementById("mv-title").textContent = label;
  }

  function renderError(msg) {
    document.getElementById("mv-content").innerHTML = '<div style="opacity:0.7;">' + msg + '</div>';
  }

  function renderMenu(data) {
    if (DEBUG_MODE) {
      document.getElementById("mv-content").innerHTML =
        '<pre style="white-space: pre-wrap; font-size: 0.55em; line-height:1.3; opacity:0.9;">' +
        JSON.stringify(data, null, 2)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
        '</pre>';
      console.log("MealViewer raw response:", data);
      return;
    }

    var schedules = (data && data.menuSchedules) || [];
    if (!schedules.length) {
      renderError("No menu scheduled for today.");
      return;
    }

    var allBlocks = [];
    for (var s = 0; s < schedules.length; s++) {
      var blocks = schedules[s].menuBlocks || [];
      for (var b = 0; b < blocks.length; b++) {
        allBlocks.push(blocks[b]);
      }
    }

    var breakfastBlocks = [];
    var lunchBlocks = [];
    for (var bb = 0; bb < allBlocks.length; bb++) {
      var blockName = (allBlocks[bb].blockName || "").toLowerCase();
      if (blockName.indexOf("breakfast") !== -1) {
        breakfastBlocks.push(allBlocks[bb]);
      } else {
        lunchBlocks.push(allBlocks[bb]);
      }
    }

    var hasBreakfast = breakfastBlocks.length > 0;
    var hasLunch = lunchBlocks.length > 0;

    if (!hasBreakfast && !hasLunch) {
      renderError("No items listed today.");
      return;
    }

    function renderBlockContent(block) {
      var lines = (block.cafeteriaLineList && block.cafeteriaLineList.data) || [];
      var html = "";
      for (var l = 0; l < lines.length; l++) {
        var line = lines[l];
        var items = (line.foodItemList && line.foodItemList.data) || [];
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var itemType = (item.item_Type || "").toUpperCase();
          if (SKIP_ITEM_TYPES.indexOf(itemType) !== -1) continue;
          if (!item.item_Name) continue;

          var allergenMatch = hasAllergen(item);
          var liStyle = "";
          var badge = "";

          if (allergenMatch) {
            liStyle = ' style="background-color: rgba(255, 0, 0, 0.2); padding: 4px 8px; border-radius: 4px; margin: 2px 0;"';
            badge = '<span style="color: #ff6b6b; font-weight: bold; margin-right: 6px;">⚠️</span>';
          }

          html += "<li" + liStyle + ">" + badge + item.item_Name.trim() + "</li>";
        }
      }
      return html;
    }

    var containerStyle = hasBreakfast && hasLunch ? 'display: flex; gap: 20px; flex-wrap: wrap;' : '';
    var columnStyle = hasBreakfast && hasLunch ? 'flex: 1; min-width: 200px;' : '';
    var html = '<div style="' + containerStyle + '">';

    if (hasBreakfast) {
      html += '<div style="' + columnStyle + '">';
      html += '<div style="font-weight:600; opacity:0.8; margin-bottom:8px; text-transform: uppercase; font-size: 0.9em;">Breakfast</div>';
      html += '<ul style="margin:0; padding-left: 1.2em;">';
      for (var bf = 0; bf < breakfastBlocks.length; bf++) {
        html += renderBlockContent(breakfastBlocks[bf]);
      }
      html += '</ul></div>';
    }

    if (hasLunch) {
      html += '<div style="' + columnStyle + '">';
      html += '<div style="font-weight:600; opacity:0.8; margin-bottom:8px; text-transform: uppercase; font-size: 0.9em;">Lunch</div>';
      html += '<ul style="margin:0; padding-left: 1.2em;">';
      for (var ln = 0; ln < lunchBlocks.length; ln++) {
        html += renderBlockContent(lunchBlocks[ln]);
      }
      html += '</ul></div>';
    }

    html += '</div>';
    document.getElementById("mv-content").innerHTML = html;
  }

  function loadMenu() {
    updateTitle();
    fetch(buildUrl())
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(renderMenu)
      .catch(function (err) {
        console.error("MealViewer widget error:", err);
        renderError("Menu unavailable (see console — likely a CORS block; set up the proxy).");
      });
  }

  loadMenu();
  setInterval(loadMenu, 60 * 60 * 1000);
})();
</script>
